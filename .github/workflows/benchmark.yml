name: SPSC Benchmarks

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container: debian:13
    strategy:
      matrix:
        compiler: [gcc-14, clang-19]
        include:
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            pkg: g++-14
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
            pkg: clang-19

    name: bench (${{ matrix.compiler }})

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ${{ matrix.pkg }} cmake ninja-build git ca-certificates

      - uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run throughput benchmark
        run: ./build/spsc_bench --benchmark_format=json --benchmark_out=throughput.json

      - name: Run latency benchmark
        run: ./build/spsc_latency | tee latency.txt

      - name: Print throughput results
        run: |
          echo "## Throughput (${{ matrix.compiler }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./build/spsc_bench --benchmark_format=console 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Print latency results
        run: |
          echo "## RTT Latency (${{ matrix.compiler }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat latency.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results-${{ matrix.compiler }}
          path: |
            throughput.json
            latency.txt
          retention-days: 90
